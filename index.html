<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tracker de série</title>
<style>
  :root {
    --ink: #15151a;
    --surface: #1e1e25;
    --surface-2: #262630;
    --paper: #f3efe6;
    --muted: #8d8d96;
    --line: #313139;
    --danger: #e8483a;

    --anime: #5ac8fa;
    --serie: #f2b84b;
    --manga: #e8483a;

    --accent-gold: #f2b84b;
    --accent-gold-light: #ffd98a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    touch-action: manipulation;
    background-color: var(--ink);
    background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
    background-size: 14px 14px;
    color: var(--paper);
    padding: 1.1rem 1rem 6.5rem;
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    margin-bottom: 1.6rem;
  }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }

  h1 {
    font-family: "Arial Black", "Helvetica Neue", sans-serif;
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: 1.9rem;
    color: var(--paper);
    transform: skewX(-3deg);
  }

  .tri-rule {
    display: flex;
    height: 4px;
    width: 130px;
    margin: 0.7rem auto 0;
    border-radius: 4px;
    overflow: hidden;
  }
  .tri-rule span { flex: 1; }
  .tri-rule span:nth-child(1) { background: var(--anime); }
  .tri-rule span:nth-child(2) { background: var(--serie); }
  .tri-rule span:nth-child(3) { background: var(--manga); }

  /* ---------- Formulaire ---------- */
  .add-form {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 1rem;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.5);
  }

  .form-group {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  input, select {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 0.75rem 0.85rem;
    border-radius: 9px;
    font-size: 1rem;
    outline: none;
    min-height: 44px;
  }

  input:focus, select:focus {
    border-color: var(--serie);
  }

  input[type="text"] { flex: 1; min-width: 180px; }
  input[type="number"] { width: 84px; }
  select {
    flex: 1;
    min-width: 110px;
    -webkit-appearance: none;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 2rem;
  }

  #manga-inputs { display: none; gap: 0.5rem; }

  button.btn-add {
    background: var(--paper);
    color: var(--ink);
    border: none;
    padding: 0.8rem 1.25rem;
    border-radius: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.85rem;
    cursor: pointer;
    min-height: 44px;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  button.btn-add:active {
    transform: scale(0.96);
    background: var(--serie);
  }

  /* ---------- Filtres et tri ---------- */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    margin-bottom: 1.2rem;
  }

  .filters, .sort-controls {
    display: flex;
    gap: 1.1rem;
    overflow-x: auto;
    padding-bottom: 0.3rem;
    align-items: center;
  }

  .sort-label {
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .filter-btn, .sort-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    padding: 0.4rem 0.1rem;
    cursor: pointer;
    white-space: nowrap;
    font-size: 0.88rem;
    font-weight: 600;
    min-height: 36px;
  }

  .filter-btn.active, .sort-btn.active {
    color: var(--paper);
    border-bottom-color: var(--serie);
  }

  /* ---------- Liste ---------- */
  .list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--muted);
    padding: 0.9rem 1rem;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.6rem;
    box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.5);
  }

  .item-card[data-type="anime"] { border-left-color: var(--anime); }
  .item-card[data-type="serie"] { border-left-color: var(--serie); }
  .item-card[data-type="manga"] { border-left-color: var(--manga); }

  .item-info {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    min-width: 0;
  }

  .item-title {
    font-weight: 700;
    font-size: 1.02rem;
    white-space: normal;
    overflow-wrap: break-word;
    word-break: break-word;
    line-height: 1.3;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    width: fit-content;
  }

  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
  }
  .item-card[data-type="anime"] .badge::before { background: var(--anime); }
  .item-card[data-type="serie"] .badge::before { background: var(--serie); }
  .item-card[data-type="manga"] .badge::before { background: var(--manga); }

  .item-counter {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
    justify-content: flex-start;
  }

  .counter-group {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    padding: 0.25rem 0.4rem;
    border-radius: 999px;
  }

  .counter-label {
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
    font-size: 0.65rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 0.1rem;
  }

  .btn-counter {
    background: var(--ink);
    border: none;
    color: var(--paper);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    flex-shrink: 0;
  }

  .btn-counter:active { background: var(--serie); color: var(--ink); }

  .count-input {
    background: transparent;
    border: none;
    color: var(--paper);
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
    font-weight: 700;
    width: 40px;
    text-align: center;
    padding: 0.2rem;
    font-size: 0.95rem;
    -moz-appearance: textfield;
  }

  .count-input::-webkit-outer-spin-button,
  .count-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .btn-delete {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.15rem;
    margin-left: 0.3rem;
    padding: 0.4rem;
  }

  .btn-delete:active { color: var(--danger); }

  /* ---------- Bouton de mise à jour ---------- */
  .btn-update {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    padding-bottom: env(safe-area-inset-bottom, 0px);

    background: linear-gradient(135deg, var(--surface), var(--ink));
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold-light);
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;

    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 10px rgba(242, 184, 75, 0.2);
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }

  .btn-update:active {
    background: var(--accent-gold);
    color: var(--ink);
    transform: translateX(-50%) scale(1.05);
    box-shadow: 0 6px 24px rgba(242, 184, 75, 0.4);
  }

  .btn-update:active .btn-icon {
    transform: rotate(180deg);
    transition: transform 0.3s ease;
  }

  .btn-icon { transition: transform 0.3s ease; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    margin-top: 2.5rem;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

  <header>
    <div class="eyebrow">Anime · Série · Manga</div>
    <h1>Tracker de séries</h1>
    <div class="tri-rule"><span></span><span></span><span></span></div>
  </header>

  <!-- Formulaire d'ajout -->
  <form class="add-form" id="media-form">
    <input type="text" id="title" placeholder="Titre (ex: One Piece, Breaking Bad)" required>
    <div class="form-group">
      <select id="type" onchange="toggleFormInputs()">
        <option value="anime">Anime</option>
        <option value="serie">Série</option>
        <option value="manga">Manga</option>
      </select>

      <div id="standard-inputs">
        <input type="number" id="progress" placeholder="N° Ep" min="0" value="1">
      </div>

      <div id="manga-inputs">
        <input type="number" id="tome-progress" placeholder="Tome" min="0" value="1">
        <input type="number" id="chap-progress" placeholder="Chap." min="0" value="1">
      </div>

      <button type="submit" class="btn-add">Ajouter</button>
    </div>
  </form>

  <!-- Filtres et Tri -->
  <div class="controls">
    <div class="filters">
      <button class="filter-btn active" onclick="filterList('all', this)">Tous</button>
      <button class="filter-btn" onclick="filterList('anime', this)">Animes</button>
      <button class="filter-btn" onclick="filterList('serie', this)">Séries</button>
      <button class="filter-btn" onclick="filterList('manga', this)">Mangas</button>
    </div>

    <div class="sort-controls">
      <span class="sort-label">Trier par :</span>
      <button class="sort-btn active" onclick="setSortMode('date', this)">Récents</button>
      <button class="sort-btn" onclick="setSortMode('az', this)">A-Z</button>
      <button class="sort-btn" onclick="setSortMode('za', this)">Z-A</button>
    </div>
  </div>

  <!-- Liste des éléments -->
  <div class="list" id="media-list"></div>

  <button class="btn-update" onclick="window.location.reload(true)">
    <span class="btn-icon">🔄</span> Mettre à jour
  </button>

  <script>
    let mediaData = JSON.parse(localStorage.getItem('myMediaTracker')) || [];
    let currentFilter = 'all';
    let currentSort = 'date';

    const form = document.getElementById('media-form');
    const mediaList = document.getElementById('media-list');
    const typeSelect = document.getElementById('type');

    function toggleFormInputs() {
      const type = typeSelect.value;
      const stdInputs = document.getElementById('standard-inputs');
      const mangaInputs = document.getElementById('manga-inputs');

      if (type === 'manga') {
        stdInputs.style.display = 'none';
        mangaInputs.style.display = 'flex';
      } else {
        stdInputs.style.display = 'block';
        mangaInputs.style.display = 'none';
      }
    }

    toggleFormInputs();

    function saveData() {
      localStorage.setItem('myMediaTracker', JSON.stringify(mediaData));
      renderList();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const type = typeSelect.value;

      if (title) {
        if (type === 'manga') {
          const tome = parseInt(document.getElementById('tome-progress').value) || 0;
          const chapitre = parseInt(document.getElementById('chap-progress').value) || 0;
          mediaData.push({ id: Date.now(), title, type, tome, chapitre });
        } else {
          const progress = parseInt(document.getElementById('progress').value) || 0;
          mediaData.push({ id: Date.now(), title, type, progress });
        }
        saveData();
        form.reset();
        toggleFormInputs();
        document.getElementById('progress').value = 1;
        document.getElementById('tome-progress').value = 1;
        document.getElementById('chap-progress').value = 1;
      }
    });

    function updateMangaProgress(id, field, change) {
      mediaData = mediaData.map(item => {
        if (item.id === id) {
          const currentVal = item[field] || 0;
          const newVal = Math.max(0, currentVal + change);
          return { ...item, [field]: newVal };
        }
        return item;
      });
      saveData();
    }

    function setMangaProgressDirect(id, field, value) {
      const val = parseInt(value);
      if (isNaN(val) || val < 0) return;

      mediaData = mediaData.map(item => {
        if (item.id === id) {
          return { ...item, [field]: val };
        }
        return item;
      });
      saveData();
    }

    function updateProgress(id, change) {
      mediaData = mediaData.map(item => {
        if (item.id === id) {
          const newProgress = Math.max(0, (item.progress || 0) + change);
          return { ...item, progress: newProgress };
        }
        return item;
      });
      saveData();
    }

    function setProgressDirect(id, value) {
      const val = parseInt(value);
      if (isNaN(val) || val < 0) return;

      mediaData = mediaData.map(item => {
        if (item.id === id) {
          return { ...item, progress: val };
        }
        return item;
      });
      saveData();
    }

    function deleteItem(id) {
      if (confirm('Voulez-vous vraiment supprimer cet élément ?')) {
        mediaData = mediaData.filter(item => item.id !== id);
        saveData();
      }
    }

    function filterList(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }

    function setSortMode(sortMode, btn) {
      currentSort = sortMode;
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }

    function renderList() {
      mediaList.innerHTML = '';

      let filteredData = currentFilter === 'all'
        ? [...mediaData]
        : mediaData.filter(item => item.type === currentFilter);

      if (currentSort === 'az') {
        filteredData.sort((a, b) => a.title.localeCompare(b.title, 'fr', { sensitivity: 'base' }));
      } else if (currentSort === 'za') {
        filteredData.sort((a, b) => b.title.localeCompare(a.title, 'fr', { sensitivity: 'base' }));
      } else {
        filteredData.sort((a, b) => b.id - a.id);
      }

      if (filteredData.length === 0) {
        mediaList.innerHTML = `<p class="empty-state">Aucun élément trouvé.</p>`;
        return;
      }

      filteredData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.dataset.type = item.type;

        let counterHtml = '';

        if (item.type === 'manga') {
          const tomeVal = item.tome !== undefined ? item.tome : 0;
          const chapVal = item.chapitre !== undefined ? item.chapitre : (item.progress || 0);

          counterHtml = `
            <div class="counter-group">
              <span class="counter-label">Vol.</span>
              <button class="btn-counter" onclick="updateMangaProgress(${item.id}, 'tome', -1)">-</button>
              <input type="number"
                     class="count-input"
                     value="${tomeVal}"
                     min="0"
                     onchange="setMangaProgressDirect(${item.id}, 'tome', this.value)">
              <button class="btn-counter" onclick="updateMangaProgress(${item.id}, 'tome', 1)">+</button>
            </div>

            <div class="counter-group">
              <span class="counter-label">Ch.</span>
              <button class="btn-counter" onclick="updateMangaProgress(${item.id}, 'chapitre', -1)">-</button>
              <input type="number"
                     class="count-input"
                     value="${chapVal}"
                     min="0"
                     onchange="setMangaProgressDirect(${item.id}, 'chapitre', this.value)">
              <button class="btn-counter" onclick="updateMangaProgress(${item.id}, 'chapitre', 1)">+</button>
            </div>
          `;
        } else {
          counterHtml = `
            <div class="counter-group">
              <span class="counter-label">Ep.</span>
              <button class="btn-counter" onclick="updateProgress(${item.id}, -1)">-</button>
              <input type="number"
                     class="count-input"
                     value="${item.progress || 0}"
                     min="0"
                     onchange="setProgressDirect(${item.id}, this.value)">
              <button class="btn-counter" onclick="updateProgress(${item.id}, 1)">+</button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="item-info">
            <span class="item-title">${item.title}</span>
            <span class="badge">${item.type}</span>
          </div>
          <div class="item-counter">
            ${counterHtml}
            <button class="btn-delete" onclick="deleteItem(${item.id})" title="Supprimer">🗑️</button>
          </div>
        `;

        mediaList.appendChild(card);
      });
    }

    renderList();
  </script>
</body>
</html>
